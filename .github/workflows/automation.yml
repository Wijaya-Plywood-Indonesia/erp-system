name: Deploy & Release

on:
  push:
    branches: [staging-kayu, staging-wahana]
    tags: ['v*', 'kayu-*', 'wahana-*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Target deploy'
        type: choice
        options: [erp-system, erp-wahana, both]
        default: both
      ref:
        description: 'Branch atau tag yang di-deploy'
        required: true
        default: staging-kayu

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      ref: ${{ steps.m.outputs.ref }}
    steps:
      - id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.ref }}"
            case "${{ inputs.target }}" in
              erp-system) T='["erp-system"]' ;;
              erp-wahana) T='["erp-wahana"]' ;;
              *)          T='["erp-system","erp-wahana"]' ;;
            esac
          else
            REF="${GITHUB_REF_NAME}"
            case "$REF" in
              staging-kayu|kayu-*)     T='["erp-system"]' ;;
              staging-wahana|wahana-*) T='["erp-wahana"]' ;;
              v*)                      T='["erp-system","erp-wahana"]' ;;
              *) echo "Ref tidak dikenali: $REF"; exit 1 ;;
            esac
          fi
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "matrix={\"target\":$T}" >> $GITHUB_OUTPUT

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Deploy ${{ matrix.target }} (${{ needs.plan.outputs.ref }})
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ matrix.target }}
          GIT_REF: ${{ needs.plan.outputs.ref }}
          APP_SERVICE: app
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: APP_DIR,GIT_REF,APP_SERVICE
          script_stop: true
          script: |
            set -euo pipefail
            cd "$HOME/apps/$APP_DIR"

            git fetch --all --tags --prune
            if git show-ref --verify --quiet "refs/remotes/origin/$GIT_REF"; then
              git checkout "$GIT_REF"
              git reset --hard "origin/$GIT_REF"
            else
              git checkout "tags/$GIT_REF"
            fi

            run() { docker compose exec -T "$APP_SERVICE" "$@"; }

            run php artisan down --retry=60 || true
            trap 'run php artisan up' EXIT

            run composer install --no-dev --optimize-autoloader --no-interaction
            run php artisan migrate --force
            run php artisan route:clear
            run php artisan shield:generate --all --panel=admin   # sesuaikan ID panel
            run php artisan optimize
            run php artisan queue:restart

            echo "Deploy $APP_DIR ($GIT_REF) selesai"

  release:
    needs: [plan, deploy]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
